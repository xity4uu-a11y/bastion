[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-gate"
version = "2.1.0"
description = "Bastion v2.1 — Production-Hardened Pre-Ship Security & Anti-AI-Reverse-Engineering Release Gate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "cryptography>=43.0.0",
    "reportlab>=4.2.5",
    "typer>=0.12.5",
    "httpx>=0.27.2",
]

[project.scripts]
bastion = "app.cli:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
